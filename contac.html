<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - My Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }

    .contact-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .contact-info {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .contact-info h1 {
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 2rem;
      position: relative;
      padding-bottom: 10px;
    }

    .contact-info h1::after {
      content: '';
      position: absolute;
      width: 50px;
      height: 3px;
      background-color: #4acfee;
      bottom: 0;
      left: 0;
    }

    .contact-details {
      margin-bottom: 30px;
    }

    .contact-item {
      margin-bottom: 20px;
    }

    .contact-item h2 {
      color: #2c3e50;
      font-size: 1.2rem;
      margin-bottom: 5px;
    }

    .contact-item p, .contact-item a {
      color: #7f8c8d;
      text-decoration: none;
    }

    .contact-item a:hover {
      color: #4acfee;
    }

    .location-options {
      margin-top: 30px;
    }

    .location-option {
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .location-option:hover {
      background-color: #f0f0f0;
    }

    .location-option h3 {
      color: #2c3e50;
      margin-bottom: 5px;
    }

    .location-option p {
      color: #7f8c8d;
      font-size: 0.9rem;
    }

    .map-container {
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    #map {
      height: 100%;
      width: 100%;
      min-height: 400px;
    }

    .send-message-btn {
      background-color: #4acfee;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 20px;
    }

    .send-message-btn:hover {
      background-color: #3ab8d6;
    }

    @media (max-width: 768px) {
      .contact-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="contact-container">
    <div class="contact-info">
      <h1>Location:</h1>
      <div class="contact-details">
        <div class="contact-item">
          <p>Alandi, Pune, Maharashtra</p>
        </div>
        <div class="contact-item">
          <h2>Email:</h2>
          <a href="mailto:kaustubh.mahajan@mitaoe.ac.in">20240110068@mitaoe.ac.in</a>
        </div>
        <div class="contact-item">
          <h2>Call:</h2>
          <a href="tel:+917046828932">+91 8117031180</a>
        </div>
      </div>

      <hr style="border: 0; height: 1px; background: #eee; margin: 20px 0;">

      <div class="location-options">
        <div class="location-option">
          <h3>MIT AOE Rd</h3>
          <p>MIT Alandi Campus</p>
          <p>More options</p>
        </div>
        <div class="location-option">
          <h3>MIT AOE </h3>
        </div>
       <!---- <div class="location-option">
          <h3>PMPML BU</h3>
        </div>-->
      </div>

      <button class="send-message-btn">Send Message</button>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <!-- Leaflet JS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  
  <script>
    // Initialize the map
    document.addEventListener('DOMContentLoaded', function() {
      // Coordinates for MIT AOE, Alandi
      const mitAoe = [18.6786, 73.8987];
      
      // Create map
      const map = L.map('map').setView(mitAoe, 15);
      
      // Add tile layer (OpenStreetMap)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);
      
      // Add marker
      L.marker(mitAoe).addTo(map)
        .bindPopup('<b>MIT Academy of Engineering</b><br>Alandi, Pune');
      
      // Location option click handlers
      const locationOptions = document.querySelectorAll('.location-option');
      
      locationOptions.forEach(option => {
        option.addEventListener('click', function() {
          // Remove active class from all options
          locationOptions.forEach(opt => {
            opt.style.backgroundColor = '';
          });
          
          // Add active style to clicked option
          this.style.backgroundColor = '#f0f0f0';
          
          // In a real implementation, you would update the map view here
          // For example, if you had coordinates for each location:
          // map.setView(newCoordinates, 15);
        });
      });
      
      // Send message button handler
      const sendBtn = document.querySelector('.send-message-btn');
      sendBtn.addEventListener('click', function() {
        alert('Message functionality would be implemented here!');
        // In a real implementation, this would open a form or modal
      });
    });
  </script>
</body>
</html>
